<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F5FBF">
  <meta name="description" content="TuMuni La Matanza: todos los trámites del Municipio de La Matanza, en lenguaje de vecino. Qué llevar, cuánto cuesta y dónde se hace.">
  <title>TuMuni La Matanza · Todos tus trámites en un solo lugar</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Saltar al contenido</a>

  <!-- Barra superior: en mobile es la app bar; en escritorio, la nav (Materialize: nav) -->
  <header class="topbar" id="topbar">
    <div class="topbar__in">
      <a href="#/" class="logo" aria-label="TuMuni La Matanza, ir al inicio">
        <span class="logo__tu">Tu</span><span class="logo__muni">Muni</span>
        <span class="logo__sub">La Matanza</span>
      </a>

      <form class="topsearch" id="topsearch" role="search" autocomplete="off">
        <svg class="search__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <label class="sr" for="topsearch-input">Buscar trámite</label>
        <input id="topsearch-input" type="search" placeholder="Buscar otro trámite…">
      </form>

      <nav class="topnav" aria-label="Principal">
        <a href="#/" data-nav="inicio">Inicio</a>
        <a href="#/categorias" data-nav="categorias">Categorías</a>
        <a href="#/mis-tramites" data-nav="mis">Mis trámites</a>
        <a href="#/ayuda" data-nav="ayuda">Ayuda</a>
      </nav>

      <button class="loc-chip" id="loc-chip" type="button" aria-haspopup="dialog">
        <span class="loc-chip__pin" aria-hidden="true">📍</span>
        <span id="loc-chip-txt">Mi localidad</span>
        <span aria-hidden="true">▾</span>
      </button>
      <button class="aplus" id="aplus" type="button" aria-pressed="false" title="Agrandar el texto">A+</button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

  <footer class="footer" id="footer">
    <div class="footer__in">
      <p>Información oficial del Municipio de La Matanza · <b>TuMuni no cobra ni reemplaza al municipio</b></p>
      <p class="footer__tel"><a href="tel:147">147</a> · <a href="tel:107">107</a> · <a href="tel:911">911</a></p>
    </div>
  </footer>

  <!-- Barra inferior fija (solo mobile) -->
  <nav class="bottomnav" aria-label="Navegación de la app">
    <a href="#/" data-nav="inicio"><span class="bn-ico bn-home" aria-hidden="true"></span>Inicio</a>
    <a href="#/buscar" data-nav="buscar"><span class="bn-ico bn-search" aria-hidden="true"></span>Buscar</a>
    <a href="#/mis-tramites" data-nav="mis"><span class="bn-ico bn-list" aria-hidden="true"></span>Mis trámites</a>
    <a href="#/ayuda" data-nav="ayuda"><span class="bn-ico bn-help" aria-hidden="true"></span>Ayuda</a>
  </nav>

  <!-- Modal genérico (Materialize: modal) -->
  <div class="modal-bg" id="modal-bg" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  </div>

  <!-- Toasts (Materialize: toast) -->
  <div class="toasts" id="toasts" aria-live="assertive"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
